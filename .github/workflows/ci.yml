name: CTCAE CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q agents cli.py ctcae.py ctcae_grading.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Check packaged command
        run: ctcae-grade grade --term "Neutrophil count decreased" --value 900 --lln 1800
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
